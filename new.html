<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>記分板 Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#1a1a2e;--mid:#16213e;--panel:#0f3460;
  --red:#e94560;--gold:#f5a623;--green:#27ae60;
  --text:#eaf0fb;--muted:#8892a4;--bdr:rgba(255,255,255,.1);
}
*{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;}

button { transition: transform 0.1s, opacity 0.2s; cursor: pointer; }
button:active { transform: scale(0.92); opacity: 0.8; }

header{background:linear-gradient(135deg,var(--red),#c0392b);padding:12px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.3);}
.tabs{display:flex;background:var(--mid);position:sticky;top:0;z-index:100;border-bottom:2px solid var(--red);}
.tab{padding:14px;font-size:.9rem;font-weight:700;color:var(--muted);flex:1;text-align:center;}
.tab.active{color:var(--red);background:rgba(233,69,96,0.1);border-bottom:3px solid var(--red);}

.panel{display:none;padding:15px;max-width:1200px;margin:0 auto;}
.panel.active{display:block;}

.card{background:var(--mid);border:1px solid var(--bdr);border-radius:12px;padding:15px;margin-bottom:15px;}
input, textarea{width:100%;padding:12px;background:rgba(0,0,0,0.2);border:1px solid var(--bdr);border-radius:8px;color:white;margin-bottom:12px;font-size:16px;}

/* 計分板 */
.scoreboard{display:grid;grid-template-columns:1fr 0.3fr 1fr;align-items:center;text-align:center;background:var(--panel);border-radius:15px;padding:15px;}
.score-num{font-size:3rem;font-weight:bold; color:var(--text);}
.opp-btns{display:flex; justify-content:center; gap:5px; margin-top:10px;}
.opp-btns button{padding:6px 10px; font-size:0.7rem; border-radius:5px; background:rgba(255,255,255,0.1); color:white; border:1px solid var(--bdr);}

/* 球員卡片紀錄區 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:15px;}
.pcard{background:var(--mid);border-radius:12px;padding:12px;border:1px solid var(--bdr); position:relative;}
.pcard-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.btn-edit-small{font-size:0.7rem; color:var(--muted); border:1px solid var(--bdr); padding:2px 6px; border-radius:4px; background:none;}

.pct-display{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px;font-size:0.7rem;background:rgba(0,0,0,0.2);padding:8px;border-radius:6px;text-align:center;}
.pct-val{font-weight:bold;color:var(--green);display:block;font-size:0.8rem;}

.btn-group-score{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.btn-in{background:rgba(39,174,96,0.2);color:var(--green);border:1px solid var(--green); padding:10px 0; border-radius:8px; font-weight:bold;}
.btn-out{background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid var(--bdr); padding:8px 0; border-radius:8px; font-size:0.75rem;}

.btn-group-other{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.btn-stat{background:var(--panel); color:var(--text); border:1px solid var(--bdr); border-radius:6px; padding:8px 0; font-size:0.7rem; position:relative;}
.btn-minus{position:absolute; top:-6px; right:-6px; background:var(--red); color:white; width:18px; height:18px; border-radius:50%; font-size:12px; display:flex; align-items:center; justify-content:center; border:none; font-weight:bold;}

/* 修正彈窗 */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;z-index:1000;justify-content:center;align-items:center;padding:20px;}
.modal-content{background:var(--mid);padding:20px;border-radius:15px;width:100%;max-width:400px;border:1px solid var(--red);}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px;}
.modal-grid label{font-size:0.75rem; color:var(--muted); display:block; margin-bottom:2px;}

/* 數據表格 */
.tw{overflow-x:auto; margin-top:10px; border-radius:8px; border:1px solid var(--bdr);}
table{width:100%;border-collapse:collapse;min-width:900px;background:rgba(255,255,255,0.02);}
th,td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--bdr);}
th{background:rgba(255,255,255,0.05); color:var(--muted); font-size:0.75rem;}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);padding:12px 25px;border-radius:25px;display:none;z-index:2000;}
#export-area{position:absolute;left:-9999px;width:1000px;background:white;color:black;padding:30px;}
</style>
</head>
<body>

<header><h1>🏀 記分板</h1></header>

<div class="tabs">
    <div class="tab active" onclick="go('setup')">設定</div>
    <div class="tab" onclick="go('record')">紀錄</div>
    <div class="tab" onclick="go('history')">數據查看</div>
</div>

<!-- PANEL: SETUP -->
<div class="panel active" id="p-setup">
    <div class="card">
        <div style="font-size:0.8rem; color:var(--gold); margin-bottom:8px;">比賽基本資訊</div>
        <input type="text" id="g-team" value="我方球隊">
        <input type="text" id="g-opp" placeholder="對手名稱">
        <input type="date" id="g-date">
    </div>
    <div class="card">
        <div style="font-size:0.8rem; color:var(--gold); margin-bottom:8px;">名單匯入 (格式：號碼 姓名)</div>
        <textarea id="a-names" placeholder="例如：
30 庫里
11 湯普森
23 格林" style="height:120px;"></textarea>
        <button class="btn" style="width:100%; background:var(--gold); color:var(--bg); border:none; border-radius:8px; padding:12px; font-weight:bold;" onclick="importPlayers()">匯入名單</button>
    </div>
    <button class="btn" style="width:100%; background:var(--red); color:white; border:none; border-radius:8px; padding:15px; font-size:1.1rem; font-weight:bold;" onclick="startGame()">▶ 開始比賽</button>
</div>

<!-- PANEL: RECORD -->
<div class="panel" id="p-record">
    <div class="scoreboard card">
        <div><small id="txt-us">我方</small><span class="score-num" id="sb-us">0</span></div>
        <div style="font-size:1.2rem; color:var(--muted);">VS</div>
        <div>
            <small id="txt-them">對手</small><span class="score-num" id="sb-them">0</span>
            <div class="opp-btns">
                <button onclick="adjThem(3)">+3</button>
                <button onclick="adjThem(2)">+2</button>
                <button onclick="adjThem(1)">+1</button>
                <button style="color:var(--red)" onclick="adjThem(-1)">-1</button>
            </div>
        </div>
    </div>
    <div class="pgrid" id="pgrid"></div>
    <button class="btn" style="width:100%; background:var(--gold); color:var(--bg); margin-top:25px; padding:15px; border:none; border-radius:8px; font-weight:bold;" onclick="saveGame()">💾 儲存本場比賽數據</button>
</div>

<!-- PANEL: HISTORY -->
<div class="panel" id="p-history">
    <div class="card">
        <div id="hist-list"></div>
    </div>

    <div id="hist-detail" class="card" style="display:none; border-top:3px solid var(--gold);">
        <h2 id="detail-match-name" style="color:var(--gold); margin-bottom:5px;"></h2>
        <p id="detail-match-info" style="font-size:0.8rem; color:var(--muted); margin-bottom:15px;"></p>
        <div class="tw">
            <table>
                <thead>
                    <tr>
                        <th>#</th><th>姓名</th><th>得分</th>
                        <th>三分(%)</th><th>兩分(%)</th><th>罰球(%)</th>
                        <th>助攻</th><th>火鍋</th><th>抄截</th><th>失誤</th><th>犯規</th>
                    </tr>
                </thead>
                <tbody id="detail-body"></tbody>
            </table>
        </div>
        <button class="btn" style="width:100%; background:var(--red); color:white; margin-top:15px; padding:12px; border:none; border-radius:8px; font-weight:bold;" onclick="buildCanvas()">🖼 下載戰報圖片</button>
    </div>
</div>

<!-- 修正彈窗 (防呆機制) -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <h3 id="editPlayerName" style="color:var(--gold); margin-bottom:15px;">修正球員數據</h3>
        <div class="modal-grid" id="editInputs"></div>
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button class="btn" style="flex:1; background:rgba(255,255,255,0.1); color:white; border:none; padding:10px; border-radius:5px;" onclick="closeModal()">取消</button>
            <button class="btn" style="flex:1; background:var(--gold); color:var(--bg); border:none; padding:10px; border-radius:5px; font-weight:bold;" onclick="confirmEdit()">儲存修正</button>
        </div>
    </div>
</div>

<div id="export-area">
    <h2 id="exp-title">成績單</h2>
    <p id="exp-meta"></p>
    <table border="1" style="width:100%; border-collapse:collapse; margin-top:20px; text-align:center; font-family: sans-serif;">
        <thead>
            <tr style="background:#eee;">
                <th>#</th><th>球員</th><th>得分</th><th>三分</th><th>兩分</th><th>罰球</th><th>助</th><th>阻</th><th>抄</th><th>失</th><th>犯</th>
            </tr>
        </thead>
        <tbody id="exp-body"></tbody>
    </table>
</div>

<div id="toast"></div>

<script>
let players = [], stats = {}, score = {us:0, them:0}, gInfo = {};
let history = JSON.parse(localStorage.getItem('basket_pro_v5') || '[]');
let currentEditName = "";

function go(id){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelector(`[onclick="go('${id}')"]`).classList.add('active');
    document.getElementById('p-'+id).classList.add('active');
    if(id==='history') drawHistoryList();
}

function importPlayers(){
    const input = document.getElementById('a-names').value.trim();
    if(!input) return alert("請輸入名單");
    players = input.split('\n').filter(l => l.trim()).map(line => {
        const parts = line.trim().split(/\s+/);
        return { num: parts[0] || '?', name: parts[1] || '未知' };
    });
    showToast(`成功匯入 ${players.length} 名球員`);
}

function startGame(){
    if(players.length === 0) return alert("請先匯入名單");
    gInfo = {
        team: document.getElementById('g-team').value,
        opp: document.getElementById('g-opp').value || '對手',
        date: document.getElementById('g-date').value || new Date().toISOString().slice(0,10)
    };
    score = {us:0, them:0};
    players.forEach(p => {
        stats[p.name] = { pts:0, f3m:0, f3a:0, f2m:0, f2a:0, ftm:0, fta:0, ast:0, blk:0, stl:0, to:0, foul:0, num: p.num };
    });
    document.getElementById('txt-us').innerText = gInfo.team;
    document.getElementById('txt-them').innerText = gInfo.opp;
    refreshUI();
    go('record');
}

function refreshUI(){
    document.getElementById('sb-us').innerText = score.us;
    document.getElementById('sb-them').innerText = score.them;
    let h = '';
    players.forEach(p => {
        const s = stats[p.name];
        h += `<div class="pcard">
            <div class="pcard-hdr">
                <strong>#${s.num} ${p.name}</strong>
                <button class="btn-edit-small" onclick="openEdit('${p.name}')">修正數據 ✎</button>
            </div>
            <div class="pct-display">
                <div>三分<span class="pct-val">${pct(s.f3m,s.f3a)}</span></div>
                <div>兩分<span class="pct-val">${pct(s.f2m,s.f2a)}</span></div>
                <div>罰球<span class="pct-val">${pct(s.ftm,s.fta)}</span></div>
                <div style="grid-column: span 3; margin-top:5px; border-top:1px solid rgba(255,255,255,0.1); padding-top:5px;">
                    個人得分: <b style="color:var(--gold); font-size:1.1rem;">${s.pts}</b>
                </div>
            </div>
            <div class="btn-group-score">
                <button class="btn-in" onclick="upS('${p.name}','f3',1)">+3</button>
                <button class="btn-in" onclick="upS('${p.name}','f2',1)">+2</button>
                <button class="btn-in" onclick="upS('${p.name}','ft',1)">+1</button>
                <button class="btn-out" onclick="upS('${p.name}','f3',0)">3分失</button>
                <button class="btn-out" onclick="upS('${p.name}','f2',0)">2分失</button>
                <button class="btn-out" onclick="upS('${p.name}','ft',0)">罰球失</button>
            </div>
            <div class="btn-group-other">
                ${['ast','blk','stl','to','foul'].map(k => `
                    <button class="btn-stat" onclick="upO('${p.name}','${k}',1)">
                        ${lbl(k)}<br>${s[k]}
                        <div class="btn-minus" onclick="event.stopPropagation(); upO('${p.name}','${k}',-1)">-</div>
                    </button>
                `).join('')}
            </div>
        </div>`;
    });
    document.getElementById('pgrid').innerHTML = h;
}

function lbl(k){ return {ast:'助攻',blk:'火鍋',stl:'抄截',to:'失誤',foul:'犯規'}[k]; }
function pct(m,a){ return a===0 ? "0% (0/0)" : `${Math.round((m/a)*100)}% (${m}/${a})`; }

function upS(name, type, hit){
    const s = stats[name];
    if(hit){
        s[type+'m']++; s[type+'a']++;
        let p = type==='f3'?3:(type==='f2'?2:1);
        s.pts += p; score.us += p;
    } else { s[type+'a']++; }
    refreshUI();
}

function upO(name, type, v){
    stats[name][type] = Math.max(0, stats[name][type] + v);
    refreshUI();
}

function adjThem(v){ score.them = Math.max(0, score.them+v); refreshUI(); }

function openEdit(name){
    currentEditName = name;
    document.getElementById('editPlayerName').innerText = `修正 #${stats[name].num} ${name} 數據`;
    const fields = [
        {k:'f3m', l:'3分命中'}, {k:'f3a', l:'3分出手'},
        {k:'f2m', l:'2分命中'}, {k:'f2a', l:'2分出手'},
        {k:'ftm', l:'罰球命中'}, {k:'fta', l:'罰球出手'},
        {k:'ast', l:'助攻'}, {k:'blk', l:'火鍋'},
        {k:'stl', l:'抄截'}, {k:'to', l:'失誤'}, {k:'foul', l:'犯規'}
    ];
    let h = '';
    fields.forEach(f => {
        h += `<div><label>${f.l}</label><input type="number" id="edit_${f.k}" value="${stats[name][f.k]}"></div>`;
    });
    document.getElementById('editInputs').innerHTML = h;
    document.getElementById('editModal').style.display = 'flex';
}

function confirmEdit(){
    const s = stats[currentEditName];
    const fields = ['f3m','f3a','f2m','f2a','ftm','fta','ast','blk','stl','to','foul'];
    fields.forEach(f => {
        s[f] = parseInt(document.getElementById(`edit_${f}`).value) || 0;
    });
    s.pts = (s.f3m * 3) + (s.f2m * 2) + s.ftm;
    let total = 0;
    for(let n in stats){ total += stats[n].pts; }
    score.us = total;
    closeModal();
    refreshUI();
}

function closeModal(){ document.getElementById('editModal').style.display = 'none'; }

function saveGame(){
    if(!confirm("確定要結束並儲存比賽數據嗎？")) return;
    history.unshift({ info:{...gInfo}, score:{...score}, players:[...players], stats:JSON.parse(JSON.stringify(stats)) });
    localStorage.setItem('basket_pro_v5', JSON.stringify(history));
    showToast("比賽數據已存檔 ✓");
    go('history');
}

function drawHistoryList(){
    const container = document.getElementById('hist-list');
    if(history.length === 0){ container.innerHTML = "<p>尚無歷史紀錄</p>"; return; }
    container.innerHTML = history.map((g, i) => `
        <div class="card" onclick="viewDetail(${i})" style="cursor:pointer; border-left:6px solid var(--red); display:flex; justify-content:space-between; align-items:center;">
            <div>
                <small style="color:var(--muted)">${g.info.date}</small>
                <div style="font-weight:bold;">${g.info.team} ${g.score.us} : ${g.score.them} ${g.info.opp}</div>
            </div>
            <span style="color:var(--gold); font-size:0.8rem;">查看 ➔</span>
        </div>
    `).join('');
}

function viewDetail(idx){
    const g = history[idx];
    window.currentHistoryIdx = idx;
    document.getElementById('hist-detail').style.display = 'block';
    document.getElementById('detail-match-name').innerText = `${g.info.team} VS ${g.info.opp}`;
    document.getElementById('detail-match-info').innerText = `${g.info.date} | 最終比分 ${g.score.us}:${g.score.them}`;
    let html = '';
    g.players.forEach(p => {
        const s = g.stats[p.name];
        html += `<tr><td>${p.num}</td><td>${p.name}</td><td style="color:var(--red); font-weight:bold;">${s.pts}</td><td>${pct(s.f3m, s.f3a)}</td><td>${pct(s.f2m, s.f2a)}</td><td>${pct(s.ftm, s.fta)}</td><td>${s.ast}</td><td>${s.blk}</td><td>${s.stl}</td><td>${s.to}</td><td>${s.foul}</td></tr>`;
    });
    document.getElementById('detail-body').innerHTML = html;
    document.getElementById('hist-detail').scrollIntoView({behavior: 'smooth'});
}

function buildCanvas(){
    const g = history[window.currentHistoryIdx];
    document.getElementById('exp-title').innerText = `${g.info.team} VS ${g.info.opp} 賽後數據`;
    document.getElementById('exp-meta').innerText = `${g.info.date} | 比分 ${g.score.us}:${g.score.them}`;
    let html = '';
    g.players.forEach(p => {
        const s = g.stats[p.name];
        html += `<tr><td>${p.num}</td><td>${p.name}</td><td>${s.pts}</td><td>${s.f3m}/${s.f3a}</td><td>${s.f2m}/${s.f2a}</td><td>${s.ftm}/${s.fta}</td><td>${s.ast}</td><td>${s.blk}</td><td>${s.stl}</td><td>${s.to}</td><td>${s.foul}</td></tr>`;
    });
    document.getElementById('exp-body').innerHTML = html;
    html2canvas(document.getElementById('export-area')).then(canvas => {
        const link = document.createElement('a');
        link.download = `戰報_${g.info.date}.png`;
        link.href = canvas.toDataURL();
        link.click();
    });
}

function showToast(msg){
    const t = document.getElementById('toast');
    t.innerText = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}
document.getElementById('g-date').value = new Date().toISOString().slice(0,10);
</script>
</body>
</html>
